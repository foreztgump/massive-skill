schema: spec-driven

context: |
  Project: massive-skill
  Overview: Agent skill wrapping Massive.com's REST API for querying U.S. stock,
    options, and futures market data. Pure bash scripts (curl + jq) following
    the Agent Skills open standard (agentskills.io) for cross-platform
    compatibility (Claude Code, Cursor, Codex, OpenClaw, 30+ agents).
  Stack: Bash (curl + jq), no runtime dependencies
  API: Massive.com REST API at api.massive.com (v1/v2/v3 + futures/vX)
  Auth: MASSIVE_API_KEY via query param or Bearer header
  Data Domains: Stocks (19 exchanges + dark pools), Options (17 exchanges via OPRA),
    Futures (CME, CBOT, COMEX, NYMEX)
  Endpoints: Aggregates, Trades, Quotes, Snapshots, News, Tickers, Dividends,
    Splits, IPOs, Financials, Technical Indicators, Market Status, Exchanges
  Testing: bats (Bash Automated Testing System) + shellcheck
  Distribution: Agent Skills open standard, install.sh, Makefile

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then format
  design:
    - Include sequence diagrams for complex flows
    - Prefer deep modules (simple interface, complex implementation)
    - Address information hiding
    - Consider at least two design approaches before committing
    - Document dependency direction
  tasks:
    - Each task < 2 hours
    - Include acceptance criteria
    - Specify test files to create/update
    - Include applicable code quality constraints from CODE_PRINCIPLES.md
    - Specify error handling strategy for the task's scope
  code:
    - Functions do one thing
    - No magic values — all literals that aren't self-evident must be named constants
    - Prefer deep modules — simple interface, complex implementation
    - Error handling is mandatory for all HTTP operations and JSON parsing
    - Names reveal intent — no abbreviations, no generic names
    - Maximum 3 levels of nesting — use early returns, extraction, or guard clauses
    - Comments explain WHY, not WHAT
    - No duplicated logic — extract shared behavior into _lib.sh
    - KISS — pick the simplest solution that works
    - YAGNI — only build what the task requires
